name: Validate Vi Ctrl-Y matrix

on:
  push:
    branches:
      - ops/vi-ctrl-y-worker

permissions:
  contents: read

jobs:
  test-target:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.14t"]

    steps:
      - name: Check out verified target
        uses: actions/checkout@v6.0.2
        with:
          ref: f169827167bc83336af8e3033adf233c8d8043c3

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Code formatting
        if: ${{ matrix.python-version == '3.14' }}
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Typos
        if: ${{ matrix.python-version == '3.14' }}
        run: uv run typos .

      - name: Focused Vi Ctrl-Y tests
        run: uv run pytest -q tests/test_vi_insert_bindings.py

      - name: Unit test
        run: uv run coverage run -m pytest tests/

      - name: Type Checking
        run: |
          uv run mypy --strict src/ --platform win32
          uv run mypy --strict src/ --platform linux
          uv run mypy --strict src/ --platform darwin
